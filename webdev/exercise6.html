<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container {
            width: 98vw;
            border: 2px solid black;
            display: flex;
            justify-content: space-between;
            align-items: center;



        }

        .nav {
            display: flex;
            justify-content: center;

            /* align-items: end; */
        }

        .select {

            width: auto;
            margin-left: 0px;
            margin-right: 70px;
            list-style: none;
            display: flex;
            padding: 0;



        }




        img {
            height: 70px;
            display: flex;

        }

        .content {
            margin: 0 15px;
            cursor: pointer;
        }

        .button {
            height: 40px;
            display: flex;
            justify-content: center;
        }

        .button1 {
            display: flex;
            margin: 0 30px;
            border: transparent;
            justify-content: center;
            align-items: center;
        }

        .button2 {
            margin: 0 20px;
            border: transparent;
        }
    </style>
</head>

<body>
    <!--by only using flexbox design the nav bar-->
    <div class="container">
        <img src="https://www.ultraedit.com/wp-content/uploads/2023/01/UE_Site-Logo.png" alt="" id="img">

        <div class="nav">
            <ul class="select">
                <li class="content">Products</li>
                <li class="content">Pricing</li>
                <li class="content">Resources</li>
                <li class="content">Our company</li>
            </ul>

            <div class="button">
                <button type="submit" class="button1">Download
                </button>
                <button type="button" class="button2">English
                </button>
            </div>
        </div>

    </div>
</body>

</html>
