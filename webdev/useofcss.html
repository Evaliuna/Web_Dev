<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <style>
        body {
            background-color: lightblue;
        }

        h1,
        h2 {
            color: navy;
            text-align: center;
        }

        p {
            font-family: Arial, sans-serif;
            font-size: 18px;
        }
    </style><!-- internal CSS -->

    <link rel="stylesheet" href="styles.css"><!-- external CSS -->

</head>

<body>
    <div>
        <h1 style="color:blue; text-align:center;">This is a heading using inline CSS</h1><!-- inline CSS -->
        <h2>This is a subheading using internal CSS</h2>
        <p style="font-size:20px; font-family:Arial;">This is a paragraph using inline CSS.</p>
    </div>
</body>

</html>
