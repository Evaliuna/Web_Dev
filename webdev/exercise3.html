<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 3</title>
    <style>
        body {
            background-color: lightgrey;
        }

        .card {
            width: 30vw;
            height: 95vh;
            margin: 50px auto;
            background-color: white;
            border: 1px solid rgb(156, 156, 156);
            border-radius: 3%;

        }

        .card-img {
            text-align: center;
        }

        .card-img img {
            width: 28vw;
            height: 40vh;
            border-radius: 4%;
            margin-top: 15px;
        }

        .content {
            padding-top: 25px;
            padding-left: 40px;
        }

        .tag {
            text-decoration: none;
            color: gray;
            font-family: Arial, sans-serif;
            font-size: 15px;
            padding: 5px 15px;
            margin: 10px 7px;
            border: 1px solid grey;
            border-radius: 25px;
            background-color: #f0f0f0;
        }

        .tag:hover {
            background-color: #d0d0d0;
        }

        #title {
            font-family: cursive;
            font-size: 28px;
            font-weight: bold;
            margin: 10px;
            padding-top: 25px;
            padding-left: 24px;
        }

        #para {
            font-family: poppins, sans-serif;
            color: gray;
            font-size: 16px;
            margin: 0px;
            padding: 35px;
            padding-top: 0px;
        }

        .button {
            text-align: center;
            padding-top: 30px;
        }

        .button button {
            padding: 10px 25px;
            border-radius: 15px;
            background-color: lightblue;
            color: rgb(30, 108, 252);
            font-size: 14px;
            font-weight: bold;
            border: none;
        }

        .button button:hover {
            background-color: deepskyblue;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="card-img">
            <img src="card.png" alt="card image">
        </div>
        <div class="content">
            <a href="" class="tag">Nature</a>
            <a href="" class="tag"> Lake</a>
        </div>
        <h2 id="title">Lago di Braies</h2>
        <p id="para">Lorem ipsum dolor sit amet consectetur adipisicing elit. Quaerat porro, mollitia, doloribus eum
            aliquid
            hic ut
            dolorum, voluptatum eveniet ad officiis? Repudiandae veniam architecto ratione.</p>
        <div class="button">
            <button>Read More</button>
        </div>

    </div>
</body>

</html>
